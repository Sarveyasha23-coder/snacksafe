name: SnackSafe CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run domain tests
        run: npm test
      - name: Run ESLint
        run: npm run lint
      - name: Run TypeScript application check
        run: npx tsc --noEmit
      - name: Build production app
        run: npm run build
