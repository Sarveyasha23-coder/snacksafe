name: Dependency security audit

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Audit dependencies
        run: npm audit --audit-level=high
